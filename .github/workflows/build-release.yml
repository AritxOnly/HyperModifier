name: Build HyperModifier release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Calculate this run's patch version
        id: version
        shell: bash
        run: |
          source_name=$(sed -n 's/.*configuredVersionName = .*?: "\([0-9.]*\)"/\1/p' app/build.gradle.kts | head -n 1)
          source_code=$(sed -n 's/.*?: \([0-9][0-9]*\)$/\1/p' app/build.gradle.kts | head -n 1)
          IFS='.' read -r major minor patch <<< "$source_name"
          echo "name=$major.$minor.$((patch + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "code=$((source_code + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Assemble installable debug APK
        run: ./gradlew assembleDebug -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperModifier-v${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/debug/app-debug.apk

      # Add these repository secrets to publish an installable release:
      # HYPERMODIFIER_KEYSTORE_BASE64, HYPERMODIFIER_KEY_ALIAS and HYPERMODIFIER_SIGNING_PASSWORD.
      - name: Restore signing key
        if: ${{ secrets.HYPERMODIFIER_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.HYPERMODIFIER_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/hypermodifier.jks"

      - name: Assemble signed release APK
        if: ${{ secrets.HYPERMODIFIER_KEYSTORE_BASE64 != '' }}
        env:
          HYPERMODIFIER_SIGNING_PASSWORD: ${{ secrets.HYPERMODIFIER_SIGNING_PASSWORD }}
        run: ./gradlew assembleRelease -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }} -PhypermodifierStoreFile="$RUNNER_TEMP/hypermodifier.jks" -PhypermodifierKeyAlias=${{ secrets.HYPERMODIFIER_KEY_ALIAS }}

      - name: Publish GitHub Release
        if: ${{ secrets.HYPERMODIFIER_KEYSTORE_BASE64 != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: HyperModifier v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
